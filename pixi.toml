[workspace]
name = "dinov3-yolov12"
version = "0.1.0"
description = "YOLOv12 with DINOv3 Vision Transformers Integration"
authors = ["Sompote", "Ultralytics"]
channels = ["conda-forge", "pytorch", "nvidia"]
platforms = [
    { platform = "win-64", cuda = "12" },
    { platform = "linux-64", cuda = "12" },
    "osx-arm64"
]

[dependencies]
python = "3.11.*"
numpy = ">=1.26.4,<2.0.0"
pytorch = ">=2.2.0"
torchvision = ">=0.17.0"
opencv = ">=4.8.0"
pillow = ">=9.5.0"
pyyaml = ">=6.0.1"
requests = ">=2.28.0"
scipy = ">=1.13.0"
tqdm = ">=4.64.0"
psutil = ">=5.9.8"
py-cpuinfo = ">=9.0.0"
pandas = ">=2.0.0"
seaborn = ">=0.12.0"
matplotlib = ">=3.6.0"
transformers = ">=4.30.0"
huggingface_hub = ">=0.23.2"
safetensors = ">=0.4.3"
timm = ">=1.0.14"
albumentations = ">=1.4.0"
pycocotools = ">=2.0.7"
onnx = ">=1.14.0"
onnxruntime = ">=1.15.0"
streamlit = ">=1.28.0"
plotly = ">=5.15.0"
pytest = ">=7.0.0"
pip = "*"
setuptools = "*"
wheel = "*"
wandb = "*"

[target.win-64.dependencies]
pytorch-gpu = "*"

[target.linux-64.dependencies]
pytorch-gpu = "*"

[pypi-dependencies]
ultralytics = { path = ".", editable = true }
supervision = ">=0.22.0"
onnxslim = ">=0.1.31"
ultralytics-thop = ">=2.0.0"
gradio = ">=4.44.0"
google-antigravity = ">=0.1.0"

[tasks]
# Training tasks
train = "python train_yolov12_dino.py"
train-single = "python train_yolov12_dino.py --data coco.yaml --yolo-size s --dino-variant vitb16 --integration single --epochs 100"
train-dual = "python train_yolov12_dino.py --data coco.yaml --yolo-size l --dino-variant vitl16 --integration dual --epochs 200"
train-dualp0p3 = "python train_yolov12_dino.py --data coco.yaml --yolo-size m --dino-variant vitb16 --integration dualp0p3 --epochs 150"
train-triple = "python train_yolov12_dino.py --data coco.yaml --yolo-size s --dino-variant vitb16 --integration triple --epochs 100"
train-obb = "python train_yolov12_dino_obb.py"
train-resume = "python train_resume.py"

# Inference tasks
infer = "python inference.py"
infer-obb = "python inferobb.py"

# Web UI tasks
streamlit = "streamlit run streamlit_app.py"
simple-streamlit = "streamlit run simple_streamlit_app.py"

# Utility & Evaluation tasks
benchmark = "python benchmark_latency.py"
test = "pytest tests/"
yolo = "yolo"
agy = "agy"
